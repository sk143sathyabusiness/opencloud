<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="OpenCloud — All your drives. One workspace.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111d3d"/>
      <stop offset="1" stop-color="#1e2f66"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <circle cx="1020" cy="120" r="180" fill="url(#glow)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="60" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="95" r="1.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="48" r="1.8"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="36" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="70" r="1.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="52" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#ffffff" opacity="0.1">
    <g transform="translate(40 60)"><ellipse rx="36" ry="14"/><ellipse cx="20" cy="-8" rx="22" ry="12"/></g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 14 0; 0 0" dur="16s" repeatCount="indefinite"/>
  </g>

  <g opacity="0.12" fill="#ffffff">
    <g transform="translate(250 -10)">
      <ellipse rx="46" ry="18"/><ellipse cx="26" cy="-10" rx="28" ry="15"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 0; 0 0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <g filter="url(#soft)">
    <text x="70" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#titleGrad)" letter-spacing="1">OpenCloud</text>
    <text x="70" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#a5b4fc">All your drives. One workspace.</text>
    <text x="70" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">Google Drive · OneDrive · Dropbox · MEGA · pCloud · Yandex · S3</text>
  </g>

  <g>
    <rect x="70" y="286" width="430" height="9" rx="4.5" fill="#ffffff" opacity="0.12"/>
    <rect x="70" y="286" width="430" height="9" rx="4.5" fill="url(#barGrad)">
      <animate attributeName="width" values="90;260;430" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="520" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#67e8f9" font-weight="600">
      syncing
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="#ffffff" opacity="0.16">
    <g transform="translate(760 210)">
      <ellipse rx="120" ry="46"/>
      <circle cx="-70" cy="-10" r="40"/>
      <circle cx="-20" cy="-32" r="52"/>
      <circle cx="45" cy="-18" r="44"/>
      <circle cx="95" cy="4" r="28"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="#67e8f9" opacity="0.14">
    <g transform="translate(1120 250)"><ellipse rx="42" ry="16"/><circle cx="-26" cy="-6" r="18"/></g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -8 0; 0 0" dur="12s" repeatCount="indefinite"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(150 300)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="700 -130" dur="7s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="7s" begin="0.5s" repeatCount="indefinite"/>
        <rect width="46" height="60" rx="7" fill="#ffffff" opacity="0.16"/>
        <rect width="46" height="18" rx="7" fill="#4285F4"/>
        <rect x="9" y="30" width="28" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
        <rect x="9" y="41" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.4"/>
      </g>
    </g>
    <g transform="translate(210 310)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="630 -170" dur="8s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="8s" begin="2s" repeatCount="indefinite"/>
        <rect width="46" height="60" rx="7" fill="#ffffff" opacity="0.16"/>
        <rect width="46" height="18" rx="7" fill="#0078D4"/>
        <rect x="9" y="30" width="28" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
        <rect x="9" y="41" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.4"/>
      </g>
    </g>
    <g transform="translate(120 318)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="760 -150" dur="7.5s" begin="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="7.5s" begin="3.5s" repeatCount="indefinite"/>
        <rect width="46" height="60" rx="7" fill="#ffffff" opacity="0.16"/>
        <rect width="46" height="18" rx="7" fill="#0061FF"/>
        <rect x="9" y="30" width="28" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
        <rect x="9" y="41" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.4"/>
      </g>
    </g>
    <g transform="translate(260 296)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="610 -120" dur="9s" begin="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="9s" begin="5s" repeatCount="indefinite"/>
        <rect width="46" height="60" rx="7" fill="#ffffff" opacity="0.16"/>
        <rect width="46" height="18" rx="7" fill="#D9272E"/>
        <rect x="9" y="30" width="28" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
        <rect x="9" y="41" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.4"/>
      </g>
    </g>
    <g transform="translate(185 322)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="700 -165" dur="8.5s" begin="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="8.5s" begin="6.5s" repeatCount="indefinite"/>
        <rect width="46" height="60" rx="7" fill="#ffffff" opacity="0.16"/>
        <rect width="46" height="18" rx="7" fill="#FC3F1D"/>
        <rect x="9" y="30" width="28" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
        <rect x="9" y="41" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.4"/>
      </g>
    </g>
    <g transform="translate(235 305)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="650 -140" dur="7.5s" begin="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.8;1" dur="7.5s" begin="8s" repeatCount="indefinite"/>
        <rect width="46" height="60" rx="7" fill="#ffffff" opacity="0.16"/>
        <rect width="46" height="18" rx="7" fill="#E9A11B"/>
        <rect x="9" y="30" width="28" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
        <rect x="9" y="41" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.4"/>
      </g>
    </g>
  </g>

  <g>
    <circle cx="70" cy="352" r="7" fill="#4285F4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="98" cy="352" r="7" fill="#0078D4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="126" cy="352" r="7" fill="#0061FF"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="154" cy="352" r="7" fill="#D9272E"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="182" cy="352" r="7" fill="#3FA9F5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="352" r="7" fill="#FC3F1D"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
